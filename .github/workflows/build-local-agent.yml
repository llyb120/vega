name: Build vega-local

on:
  push:
    branches: [master, main]
    paths: ["local/**", ".github/workflows/build-local-agent.yml"]
  pull_request:
    paths: ["local/**", ".github/workflows/build-local-agent.yml"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: real tray icon (getlantern/systray).
          - { name: windows-amd64, os: windows-latest, goos: windows, goarch: amd64, out: vega-local-windows-amd64.exe, cgo: "1" }
          # Linux / macOS: tray_other.go runs headless; tray deps are excluded by
          # build tags, so plain CGO-disabled builds work cross-platform.
          - { name: linux-amd64, os: ubuntu-latest, goos: linux, goarch: amd64, out: vega-local-linux-amd64, cgo: "0" }
          - { name: linux-arm64, os: ubuntu-latest, goos: linux, goarch: arm64, out: vega-local-linux-arm64, cgo: "0" }
          - { name: darwin-amd64, os: macos-latest, goos: darwin, goarch: amd64, out: vega-local-darwin-amd64, cgo: "0" }
          - { name: darwin-arm64, os: macos-latest, goos: darwin, goarch: arm64, out: vega-local-darwin-arm64, cgo: "0" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: local/go.sum

      - name: Vet & build
        working-directory: local
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go vet ./...
          go build -trimpath -ldflags="-s -w ${{ matrix.goos == 'windows' && '-H=windowsgui' || '' }}" -o "${{ matrix.out }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: local/${{ matrix.out }}
          if-no-files-found: error

  release:
    name: rolling release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Rolling latest: assets are replaced on every push to master. The tag itself
      # stays on the first commit of the release (shortcut: fixed tag, switch to
      # v* tags if real version history is needed).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: local-latest
          name: vega-local latest
          body: Rolling build of vega-local from ${{ github.sha }}
          files: dist/*
