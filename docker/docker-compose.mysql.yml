# Vega with MySQL 8. Run from the repository root:
#   VEGA_TOKEN='<at least 16 random characters>' MYSQL_PASSWORD='<password>' \
#     docker compose -f docker/docker-compose.mysql.yml up -d --build
# Database rows live in MySQL; uploaded/archived files stay in the vega-data volume (next to VEGA_DB).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vega
      MYSQL_USER: vega
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 30
  vega:
    build: { context: .., dockerfile: Dockerfile.mysql }
    shm_size: 1g
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      VEGA_TOKEN: ${VEGA_TOKEN:?set VEGA_TOKEN}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["127.0.0.1:8080:8080"]
    volumes: [vega-data:/data, vega-workspace:/workspace]
volumes:
  mysql-data:
  vega-data:
  vega-workspace:
