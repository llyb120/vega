# Vega with MySQL 8. Run from the repository root:
#   VEGA_TOKEN='<at least 16 random characters>' MYSQL_PASSWORD='<password>' \
#     docker compose -f docker/docker-compose.mysql.yml up -d --build
# Database rows live in MySQL; uploaded/archived files stay in the vega-data volume (next to VEGA_DB).
services:
  mysql:
    build: ./mysql
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
  vega:
    build: ..
    shm_size: 1g
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      VEGA_TOKEN: ${VEGA_TOKEN:?set VEGA_TOKEN}
      DB_TYPE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: vega
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: vega
    ports: ["127.0.0.1:8080:8080"]
    volumes: [vega-data:/data, vega-workspace:/workspace]
volumes:
  mysql-data:
  vega-data:
  vega-workspace:
